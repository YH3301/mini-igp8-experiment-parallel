[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-igp8-experiment"
version = "6.0.0"
description = "A optimized parallel autonomous degree-8 inverse-Galois research loop"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
mini-igp8 = "mini_igp8.cli:main"

[tool.setuptools.packages.find]
include = ["mini_igp8*"]
