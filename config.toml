version = 5

[search]
master_seed = 20260905
batch_size = 1000
oversample_factor = 2
ask_ai_after_stagnation = 5000
recent_hash_limit = 1000000

[generation]
# One Sol call proposes five deliberately different hypotheses. Five Terra
# implementers then work concurrently in isolated in-repo workspaces.
candidate_count = 5
parallel_implementers = 5
max_screen_survivors = 3
max_synthesis_finalists = 3

[screening]
seeds = [98473854, 73978472, 95331953, 78066815, 85550877]
candidates_per_seed = 100

[benchmark]
seeds = [65596346, 98271061, 79645325, 55812117, 60033886, 39598420, 40852374, 25099107, 18470197, 71360943, 28905360, 94448930, 15139202, 77519619, 26587086, 10988479, 67665287, 38707421, 40825801, 67860200]
candidates_per_seed = 100

[comparison]
# Preliminary race shared by the incumbent and every surviving candidate.
master_seed = 20260906
round_seed_counts = [5, 10, 15]
candidates_per_seed = 100
oversample_factor = 2

[final_comparison]
# A separate fresh holdout race is used after synthesis. First 20 paired seeds,
# then another 40 only for the strongest two challengers.
master_seed = 20260907
round_seed_counts = [20, 40]
candidates_per_seed = 100
oversample_factor = 2
max_challengers_after_round1 = 2

[parallel]
# This is the global number of simultaneous Sage verifications. It is shared
# by every A-E or S evaluation; it is not one pool per tournament candidate.
verification_workers = 6

[discriminants]
continue_after_full_coverage = true
# Secondary objective only. New target-pair discovery always outranks this.
# During normal search, inspect at most this many already-solved pairs per batch.
max_checks_per_search_batch = 8
# During final solver selection, probe at most this many known-pair candidates
# per solver as a tie-break after missing-pair evidence.
max_checks_per_finalist = 6

[limits]
# Sage calls are telemetry only and never stop a session.
max_ai_calls_per_session = 45
max_wall_minutes_per_session = 360
ai_call_seconds = 900
solver_call_seconds = 30
verification_seconds = 30
progress_every_candidates = 100

[models]
researcher = "gpt-5.6-sol"
researcher_reasoning = "high"
implementer = "gpt-5.6-terra"
implementer_reasoning = "medium"
synthesizer = "gpt-5.6-sol"
synthesizer_reasoning = "high"
critic = "gpt-5.6-sol"
critic_reasoning = "high"
